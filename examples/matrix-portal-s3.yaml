esphome:
  name: transit-tracker-s3
  friendly_name: Transit Tracker

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

external_components:
  - source:
      type: local
      path: ../components

logger:
  level: DEBUG
  logs:
    sensor: ERROR
    text_sensor: ERROR

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "TransitTracker Fallback Hotspot"
    password: "59541bEJiaf3"

display:
  - platform: hub75
    id: matrix
    board: adafruit-matrix-portal-s3
    double_buffer: true
    update_interval: 32ms
    panel_width: 64
    panel_height: 32
    layout_cols: 2
    # We swap the G and B channels in firmware because the 64x32 panel hardware has them reversed
    g1_pin: 40
    b1_pin: 41
    g2_pin: 37
    b2_pin: 39
    e_pin: 21
    brightness: 255
    lambda: |-
      id(tracker).draw_schedule();

font:
  - file: "fonts/Pixolletta8px.ttf"
    id: pixolletta
    size: 10
    glyphs:
      - abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:;!?()"'-+/*=%@#[]{}<>|&^~
      - " "

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Los_Angeles

color:
  - id: "c_28813F"
    hex: "28813F"
  - id: "c_007CAD"
    hex: "007CAD"

transit_tracker:
  id: tracker
  base_url: "wss://tt.horner.tj/"
  limit: 3
  time_display: "arrival"
  show_units: "short"
  list_mode: "sequential"
  scroll_headsigns: false
  min_arrival_minutes: 8
  stops:
    - stop_id: "st:40_99610"
      routes:
        - "st:40_100479"
        - "st:40_2LINE"
    - stop_id: "st:40_99603"
      routes:
        - "st:40_2LINE"
        - "st:40_100479"
  styles:
    - route_id: "st:40_100479"
      name: "1"
      color: "c_28813F"
    - route_id: "st:40_2LINE"
      name: "2"
      color: "c_007CAD"
  abbreviations: []